name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PORTLESS_HTTPS: '0'
  PORTLESS_PORT: '1356'
  PORTLESS_SYNC_HOSTS: '0'

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, supabase]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install Portless with its supported Node runtime
        run: |
          npm install --global portless@0.15.6
          portless_node="$(command -v node)"
          portless_cli="$(npm root -g)/portless/dist/cli.js"
          mkdir -p "$RUNNER_TEMP/portless-bin"
          printf '#!/bin/sh\nexec "%s" "%s" "$@"\n' "$portless_node" "$portless_cli" > "$RUNNER_TEMP/portless-bin/portless"
          chmod +x "$RUNNER_TEMP/portless-bin/portless"
          echo "$RUNNER_TEMP/portless-bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install pinned tools
        run: npm install --global pnpm@11.10.0 @openai/codex@0.164.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        if: matrix.backend == 'supabase'
        with:
          version: 2.113.0
      - name: Prepare isolated local Supabase
        if: matrix.backend == 'supabase'
        run: |
          mkdir -p .local-state
          supabase start > .local-state/supabase-start.log 2>&1
          pnpm managed:prepare
      - name: Verify SQLite and native execution
        if: matrix.backend == 'sqlite'
        run: pnpm verify
      - name: Verify Supabase mode
        if: matrix.backend == 'supabase'
        run: pnpm verify:managed
      - name: Stop isolated Supabase
        if: always() && matrix.backend == 'supabase'
        run: supabase stop --no-backup > .local-state/supabase-stop.log 2>&1
